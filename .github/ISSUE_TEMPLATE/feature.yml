name: Feature request
description: Propose an improvement to EliteGitBot
title: "[Feature]: "
labels: [enhancement, needs-triage]
body:
  - type: textarea
    id: problem
    attributes: { label: Problem, description: What workflow or limitation should this solve? }
    validations: { required: true }
  - type: textarea
    id: proposal
    attributes: { label: Proposed solution, description: Describe the desired behavior and safe default. }
    validations: { required: true }
  - type: textarea
    id: alternatives
    attributes: { label: Alternatives considered }
  - type: checkboxes
    id: scope
    attributes:
      label: Scope acknowledgement
      options:
        - label: This request does not require automatic merging, approval, deletion, or untrusted-code execution by default.
          required: true
